<svg width="150" height="175" viewBox="0 0 150 175" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clay linear and radial gradients for realistic ceramic volume -->
    <linearGradient id="potClay" x1="20" y1="20" x2="140" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C66E36"/>
      <stop offset="35%" stop-color="#AF5C26"/>
      <stop offset="70%" stop-color="#93461A"/>
      <stop offset="100%" stop-color="#6F3210"/>
    </linearGradient>

    <linearGradient id="rimShading" x1="45" y1="5" x2="105" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8C3F16"/>
      <stop offset="50%" stop-color="#C66E36"/>
      <stop offset="100%" stop-color="#662909"/>
    </linearGradient>
  </defs>

  <!-- Shadow behind pot -->
  <ellipse cx="78" cy="168" rx="52" ry="7" fill="#1B2B1D" fill-opacity="0.25"/>

  <!-- Main Pot Body Silhouette -->
  <!-- Flared lip top: ~48 to 108. Neck: ~58 to 98. Belly: ~12 to 144. Base: ~45 to 110 -->
  <path d="M48 14 
           C46 8, 110 8, 108 14
           C106 20, 96 24, 94 38
           C92 48, 142 75, 142 118
           C142 152, 115 168, 78 168
           C41 168, 14 152, 14 118
           C14 75, 64 48, 62 38
           C60 24, 50 20, 48 14 Z" 
        fill="url(#potClay)" 
        stroke="#59250B" 
        stroke-width="1.8"/>

  <!-- Top Rim Lip Outer & Inner -->
  <ellipse cx="78" cy="14" rx="30" ry="7" fill="url(#rimShading)" stroke="#59250B" stroke-width="1.5"/>
  <ellipse cx="78" cy="13" rx="25" ry="4.5" fill="#4A1D06"/>

  <!-- Neck Collar Ridge -->
  <path d="M61 38 C68 42, 88 42, 95 38" stroke="#FBF5EB" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Traditional Tribal Band 1: Chevron / Arrow Motif on Neck -->
  <path d="M63 28 L66 24 L69 28 L72 24 L75 28 L78 24 L81 28 L84 24 L87 28 L90 24 L93 28" 
        stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <path d="M62 32 C72 35, 84 35, 94 32" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3" stroke-opacity="0.85"/>

  <!-- Shoulder Band: Double Line with Dots -->
  <path d="M50 55 C65 62, 91 62, 106 55" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M46 62 C65 71, 91 71, 110 62" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.9"/>
  <!-- Dots between shoulder lines -->
  <circle cx="54" cy="60" r="1.4" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="62" cy="63" r="1.4" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="70" cy="65" r="1.4" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="78" cy="66" r="1.4" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="86" cy="65" r="1.4" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="94" cy="63" r="1.4" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="102" cy="60" r="1.4" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- Upper Belly Band: Diamond / Criss-Cross Pattern -->
  <path d="M38 72 C60 84, 96 84, 118 72" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.85"/>
  <path d="M34 82 C58 96, 98 96, 122 82" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.85"/>
  <!-- Cross hatches in band -->
  <path d="M45 75 L52 87 M55 77 L62 89 M65 79 L72 90 M75 80 L82 90 M85 79 L92 89 M95 77 L102 87 M105 75 L112 85" 
        stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M52 76 L45 86 M62 78 L55 88 M72 79 L65 90 M82 80 L75 90 M92 79 L85 89 M102 78 L95 88 M112 76 L105 85" 
        stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Center Belly Tribal Motifs: Stylized Folk Wheat/Tree Sprigs -->
  <!-- Sprig 1 (Left) -->
  <path d="M42 100 L42 118 M38 106 L42 110 L46 106 M38 111 L42 115 L46 111" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <!-- Sprig 2 -->
  <path d="M56 104 L56 122 M52 110 L56 114 L60 110 M52 115 L56 119 L60 115" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <!-- Sprig 3 (Center-Left) -->
  <path d="M70 106 L70 124 M66 112 L70 116 L74 112 M66 117 L70 121 L74 117" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <!-- Sprig 4 (Center-Right) -->
  <path d="M84 106 L84 124 M80 112 L84 116 L88 112 M80 117 L84 121 L88 117" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <!-- Sprig 5 -->
  <path d="M98 104 L98 122 M94 110 L98 114 L102 110 M94 115 L98 119 L102 115" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>
  <!-- Sprig 6 (Right) -->
  <path d="M112 100 L112 118 M108 106 L112 110 L116 106 M108 111 L112 115 L116 111" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>

  <!-- Lower Belly Band: Scalloped Waves and Dots -->
  <path d="M28 126 C54 140, 102 140, 128 126" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M30 132 C42 142, 60 145, 78 145 C96 145, 114 142, 126 132" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 3" stroke-opacity="0.85"/>
  <path d="M35 142 C50 152, 106 152, 121 142" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Base Accents -->
  <path d="M48 155 C62 162, 94 162, 108 155" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.75"/>

  <!-- Soft 3D Pottery Highlight Sheen -->
  <path d="M28 85 C22 102, 24 124, 34 138" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.2"/>
</svg>
