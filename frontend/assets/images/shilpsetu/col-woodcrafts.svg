<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Warm background -->
  <rect width="120" height="120" rx="16" fill="#EDE4D6"/>
  <!-- Wooden elephant body -->
  <path d="M35 88 L35 70 C30 65, 24 55, 24 45 C24 35, 34 26, 50 26 C75 26, 95 38, 95 60 L95 88 L85 88 L85 75 L75 75 L75 88 L65 88 L65 72 L50 72 L50 88 Z" fill="#996335"/>
  <!-- Trunk raised up in traditional Indian style -->
  <path d="M26 48 C22 45, 18 36, 22 28 C26 22, 32 25, 32 30 C32 35, 27 40, 27 45" stroke="#996335" stroke-width="6" stroke-linecap="round"/>
  <!-- Tusk -->
  <path d="M28 46 L21 50" stroke="#FFF7ED" stroke-width="3" stroke-linecap="round"/>
  <!-- Eye -->
  <circle cx="36" cy="36" r="2.5" fill="#25251F"/>
  <circle cx="37" cy="35" r="0.8" fill="#FFFFFF"/>
  <!-- Ear outline and details -->
  <path d="M42 32 C48 34, 52 42, 50 50 C48 56, 42 58, 40 54" stroke="#754720" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Intricate carved floral saddle (Haudah) on back -->
  <rect x="52" y="38" width="28" height="26" rx="4" fill="#C98A4B"/>
  <rect x="55" y="41" width="22" height="20" rx="2" stroke="#FFF5EA" stroke-width="1.2" stroke-dasharray="2 1" fill="none"/>
  <!-- Lotus carving in saddle -->
  <circle cx="66" cy="51" r="4" fill="#803D1A"/>
  <path d="M66 45 C64 48, 64 51, 66 54 C68 51, 68 48, 66 45 Z" fill="#FFF5EA"/>
  <!-- Tail -->
  <path d="M95 55 C98 62, 97 70, 95 78" stroke="#754720" stroke-width="2.5" stroke-linecap="round"/>
</svg>
